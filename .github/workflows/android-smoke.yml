name: Android debug smoke build

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: android-debug-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4
  NDK_VERSION: 27.1.12297006

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          target: aarch64-linux-android
          cache-workspaces: src-tauri -> target
      - name: Install pinned Android components from the runner SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"
      - run: bun install --frozen-lockfile
      - run: bun run tauri android build --debug --apk --target aarch64 --ci -- --locked
      - name: Retain debug APK for manual installation (not a release)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windwatcher-client-android-arm64-debug
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
