name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_BUILD_JOBS: 4

jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun --bun playwright install --with-deps chromium
      - run: bun run test:e2e

  native:
    name: native (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux WebView dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache-workspaces: src-tauri -> target
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - run: cargo check --manifest-path src-tauri/Cargo.toml --all-targets --locked
      - run: cargo test --manifest-path src-tauri/Cargo.toml --lib --locked
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Lint the Windows-only DPAPI process fixture
        if: runner.os == 'Windows'
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --locked --features storage-smoke --bin storage-smoke -- -D warnings
      - name: Exercise real Windows DPAPI across processes (not interactive UI certification)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: cargo run --manifest-path src-tauri/Cargo.toml --locked --features storage-smoke --bin storage-smoke
      - name: Compile native debug host without installers
        run: bun run tauri build --debug --no-bundle --ci -- --locked
      - name: Verify Windows normal artifacts exclude the storage fixture
        if: runner.os == 'Windows'
        run: bun scripts/check-native-storage-bundle.ts src-tauri/target/debug/windwatcher-client.exe

  required:
    if: always()
    needs: [frontend, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all baseline jobs
        env:
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          NATIVE_RESULT: ${{ needs.native.result }}
        run: test "$FRONTEND_RESULT" = success && test "$NATIVE_RESULT" = success
