name: Feature request
description: Suggest an improvement to the Windwatcher client.
title: "feature: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or motivation
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Identify affected platforms and any server capability the feature requires.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
