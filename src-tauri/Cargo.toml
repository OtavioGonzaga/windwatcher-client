[package]
name = "windwatcher-client"
version = "0.0.1-dev.0"
description = "The shared desktop and Android shell for Windwatcher."
authors = ["Otavio Gonzaga"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false

[lib]
name = "windwatcher_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde_json = "=1.0.154"
tauri-plugin-http = { version = "=2.8.3", default-features = false, features = [
  "rustls-tls",
  "http2",
] }
