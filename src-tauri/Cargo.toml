[package]
name = "windwatcher-client"
version = "0.0.1-dev.0"
description = "The shared desktop and Android shell for Windwatcher."
authors = ["Otavio Gonzaga"]
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
publish = false
default-run = "windwatcher-client"

[lib]
name = "windwatcher_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = [] }
serde_json = "=1.0.154"
uuid = { version = "=1.29.0", features = ["v4"] }
tauri-plugin-http = { version = "=2.8.3", default-features = false, features = [
  "rustls-tls",
  "http2",
] }

[target.'cfg(not(windows))'.dependencies]
tauri-plugin-keyring-store = { version = "=0.2.0", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
] }
sha2 = "=0.10.9"
zeroize = "=1.9.1"

[features]
storage-smoke = []

[[bin]]
name = "storage-smoke"
path = "../tests/native-storage/main.rs"
required-features = ["storage-smoke"]

[patch.crates-io]
# Preserve failure/corruption semantics; see the vendored patch note.
android-native-keyring-store = { path = "vendor/android-native-keyring-store" }
